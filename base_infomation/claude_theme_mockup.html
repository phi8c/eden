<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App Mockup</title>
    <style>
        :root {
            --primary: #D97757; /* Terracotta */
            --primary-light: #EBB6A6;
            --bg-cream: #FDF3E7; /* Light cream background */
            --bg-white: #FFFFFF;
            --text-dark: #333333;
            --text-gray: #999999;
            --avatar-bg: #EAE8FE;
            --avatar-text: #968DDF;
            --badge-red: #EB3F33;
            --status-green: #22C55E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #E5E7EB; /* Darker background to show the device frame */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .device-frame {
            width: 100%;
            max-width: 400px;
            height: 800px; /* Fixed height for mockup presentation */
            background-color: var(--bg-cream);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid #ffffff;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px 20px; /* Extra top padding for mobile status bar area */
            color: var(--primary);
            position: relative;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            z-index: 10; /* Keep icons above the expanding search */
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Search Animation Logic */
        .search-container {
            display: flex;
            align-items: center;
            position: absolute;
            left: 24px;
            z-index: 20; /* High z-index to overlay title */
        }

        .search-input-wrapper {
            width: 0;
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            margin-left: 0;
            opacity: 0;
        }

        .search-container.active .search-input-wrapper {
            width: 250px; /* Expands to cover title but leaves bell icon */
            margin-left: 10px;
            opacity: 1;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary-light);
            outline: none;
            font-size: 14px;
            color: var(--primary);
            background-color: var(--bg-white);
            box-shadow: 0 2px 10px rgba(217, 119, 87, 0.1);
        }
        
        .search-input::placeholder {
            color: var(--primary-light);
        }

        /* Title and Dropdown */
        .title-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-btn svg {
            width: 14px;
            height: 14px;
            stroke-width: 3px;
        }

        .dropdown-popup {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: var(--bg-white);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 150px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 100;
            padding: 8px 0;
        }

        .dropdown-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(5px);
        }

        .dropdown-item {
            padding: 10px 16px;
            color: var(--text-dark);
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--bg-cream);
            color: var(--primary);
        }

        /* --- Filter Tabs --- */
        .filters {
            display: flex;
            gap: 12px;
            padding: 0 24px 20px;
        }

        .filter-chip {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
        }

        .filter-chip.active {
            background-color: var(--bg-white);
            color: var(--text-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .filter-chip.inactive {
            background-color: transparent;
            color: var(--primary-light);
            border-color: var(--primary-light);
        }

        /* --- Main Chat List --- */
        .chat-list {
            flex-grow: 1;
            background-color: var(--bg-white);
            border-radius: 30px 30px 0 0;
            padding: 10px 0;
            overflow-y: auto;
            /* Hide scrollbar */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .chat-list::-webkit-scrollbar {
            display: none;
        }

        .chat-item {
            display: flex;
            padding: 16px 24px;
            align-items: center;
            gap: 16px;
            position: relative;
            cursor: pointer;
        }
        
        .chat-item:active {
            background-color: #F9F9F9;
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: var(--avatar-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--avatar-text);
            font-weight: 600;
            font-size: 18px;
        }

        /* The small inner icon inside avatar */
        .avatar-icon {
            width: 12px;
            height: 12px;
            border: 2px solid var(--avatar-text);
            border-top: none;
            border-radius: 2px 2px 4px 4px;
            position: relative;
        }
        .avatar-icon::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border: 2px solid var(--avatar-text);
            border-radius: 50%;
        }
        
        /* Specific text override for avatar */
        .avatar.text-avatar {
            color: var(--text-gray);
            background-color: #F0F2F5;
        }
        .avatar.text-avatar .avatar-icon {
            display: none;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background-color: var(--status-green);
            border-radius: 50%;
            border: 2px solid var(--bg-white);
        }

        .chat-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-gray);
        }

        .chat-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-message {
            font-size: 14px;
            color: var(--primary-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .badge {
            background-color: var(--badge-red);
            color: white;
            font-size: 11px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            background-color: var(--bg-cream);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 24px;
            border-top: 1px solid rgba(0,0,0,0.02);
        }

        .nav-item {
            padding: 12px;
            cursor: pointer;
            color: var(--primary-light);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-item.active {
            background-color: var(--bg-white);
            color: #000000; /* Black icon for active chat */
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        /* Custom icons */
        .svg-icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

<div class="device-frame">
    <!-- Header -->
    <header>
        <!-- Search -->
        <div class="search-container" id="search-container">
            <button class="icon-btn" id="search-btn">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="search-input" placeholder="Tìm kiếm tin nhắn...">
            </div>
        </div>

        <!-- Title / Dropdown -->
        <div class="title-container">
            <button class="title-btn" id="dropdown-btn">
                <span id="dropdown-text">Gia đình</span>
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <!-- Dropdown Popup -->
            <div class="dropdown-popup" id="dropdown-popup">
                <div class="dropdown-item">Gia đình</div>
                <div class="dropdown-item">Công việc</div>
                <div class="dropdown-item">Bạn bè</div>
            </div>
        </div>

        <!-- Notification -->
        <button class="icon-btn">
            <svg class="svg-icon" viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>
    </header>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-chip active">Tất cả</button>
        <button class="filter-chip inactive">Chưa đọc</button>
        <button class="filter-chip inactive">Đã xem</button>
    </div>

    <!-- Chat List -->
    <main class="chat-list">
        <!-- Item 1 -->
        <div class="chat-item">
            <div class="avatar-wrapper">
                <div class="avatar"><div class="avatar-icon"></div></div>
                <div class="status-dot"></div>
            </div>
            <div class="chat-content">
                <div class="chat-header">
                    <span class="chat-name">Hương Ly</span>
                    <span class="chat-time">10:30</span>
                </div>
                <div class="chat-preview">
                    <span class="chat-message" style="color: var(--primary);">Tối nay đi ăn lẩu không?</span>
                    <span class="badge">1</span>
                </div>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="chat-item">
            <div class="avatar-wrapper">
                <div class="avatar"><div class="avatar-icon"></div></div>
            </div>
            <div class="chat-content">
                <div class="chat-header">
                    <span class="chat-name">Quốc Trung</span>
                    <span class="chat-time">09:15</span>
                </div>
                <div class="chat-preview">
                    <span class="chat-message">Đã gửi một tệp đính kèm</span>
                    <span class="badge">3</span>
                </div>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="chat-item">
            <div class="avatar-wrapper">
                <div class="avatar text-avatar">H</div>
            </div>
            <div class="chat-content">
                <div class="chat-header">
                    <span class="chat-name">Hội chị em</span>
                    <span class="chat-time">Hôm qua</span>
                </div>
                <div class="chat-preview">
                    <span class="chat-message">Chúc mừng sinh nhật nhé!</span>
                    <span class="badge">1</span>
                </div>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="chat-item">
            <div class="avatar-wrapper">
                <div class="avatar"><div class="avatar-icon"></div></div>
            </div>
            <div class="chat-content">
                <div class="chat-header">
                    <span class="chat-name">Tuấn Anh</span>
                    <span class="chat-time">CN</span>
                </div>
                <div class="chat-preview">
                    <span class="chat-message">Cảm ơn bạn.</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <!-- Message Icon (Active) -->
        <div class="nav-item active">
            <svg viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
        </div>
        <!-- People Icon -->
        <div class="nav-item">
            <svg class="svg-icon" viewBox="0 0 24 24" style="fill: none; stroke: currentColor;">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        </div>
        <!-- Phone Icon -->
        <div class="nav-item">
            <svg class="svg-icon" viewBox="0 0 24 24" style="fill: none; stroke: currentColor;">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        </div>
        <!-- Settings Icon -->
        <div class="nav-item">
            <svg class="svg-icon" viewBox="0 0 24 24" style="fill: none; stroke: currentColor;">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
    </nav>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchBtn = document.getElementById('search-btn');
        const searchContainer = document.getElementById('search-container');
        const searchInput = document.getElementById('search-input');
        
        const dropdownBtn = document.getElementById('dropdown-btn');
        const dropdownPopup = document.getElementById('dropdown-popup');
        const dropdownText = document.getElementById('dropdown-text');
        const dropdownItems = document.querySelectorAll('.dropdown-item');

        // Toggle Search Animation
        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Ngăn sự kiện click lan ra document
            searchContainer.classList.toggle('active');
            if (searchContainer.classList.contains('active')) {
                setTimeout(() => searchInput.focus(), 300); // Focus sau khi animation chạy gần xong
                dropdownPopup.classList.remove('show'); // Đóng popup nếu đang mở
            }
        });

        // Prevent click inside input from closing the search
        searchInput.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Toggle Dropdown Popup
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownPopup.classList.toggle('show');
            searchContainer.classList.remove('active'); // Đóng search nếu đang mở
        });

        // Handle Dropdown Item Selection
        dropdownItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownText.textContent = item.textContent; // Đổi text hiển thị
                dropdownPopup.classList.remove('show');      // Đóng popup
            });
        });

        // Close Popups/Search when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchContainer.contains(e.target)) {
                searchContainer.classList.remove('active');
            }
            if (!dropdownPopup.contains(e.target) && e.target !== dropdownBtn) {
                dropdownPopup.classList.remove('show');
            }
        });
    });
</script>

</body>
</html>
