name: Deploy

on:
  push:
    branches:
      - main

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

            backend:
              - 'backend/**'


  deploy:
    needs: changes

    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: FRONTEND_CHANGED,BACKEND_CHANGED

          script: |
            cd /home/ubuntu/lain

            echo "Pulling latest code..."
            git pull origin main

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "Deploying frontend..."

              cd /home/ubuntu/lain/frontend

              npm ci
              npm run build

              pm2 restart dove-web
            fi

            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "Deploying backend..."

              cd /home/ubuntu/lain/backend

              npm ci
              npm run build

              pm2 restart dove-api
            fi